name: GLV forms validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  forms:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate forms without sending mail
        run: node --test tests/glv-forms.test.cjs
      - name: Validate browser scripts
        run: |
          node --check assets/js/glv-forms.js
          node --check assets/js/glv-forms-config.js
