      - name: V8 — Verify OilsExportPanel is isolated from LIVE_ANIMALS
        run: |
          FAILED=0
          PANEL="glv-connect/frontend/src/components/OilsExportPanel.jsx"
          if [ ! -f "$PANEL" ]; then
            echo "::error::V8: OilsExportPanel.jsx not found"
