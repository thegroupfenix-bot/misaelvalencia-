          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8 OilsExportPanel isolation and CommercialEngine integration confirmed" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify VAL-030 through VAL-040 in validationSupervisor
        run: |
          FAILED=0
          for code in VAL-030 VAL-031 VAL-032 VAL-033 VAL-034 VAL-035 VAL-036 VAL-037 VAL-038 VAL-039 VAL-040; do
            if ! grep -q "$code" glv-connect/frontend/src/engines/validationSupervisor.js; then
              echo "::error::V8: $code missing from validationSupervisor.js"
              FAILED=1
            else
              echo "✅ validationSupervisor.js — $code present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8 VAL-030 through VAL-040 present in validationSupervisor" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify LIVE_ANIMALS unbroken after V8 oils changes
        run: |
          FAILED=0
          # LIVE_ANIMALS null-guard must still exist in ExportFormatEngine
          if ! grep -q 'LIVE_ANIMALS.*return null\|return null.*LIVE_ANIMALS' glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::V8: LIVE_ANIMALS null-guard missing from ExportFormatEngine"
            FAILED=1
          else
