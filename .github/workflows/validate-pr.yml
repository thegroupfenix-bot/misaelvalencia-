          if ! grep -q 'category !== "OILS"' "$PANEL"; then
            echo "::error::V8: OilsExportPanel.jsx missing OILS category guard — may render for other categories"
            FAILED=1
          else
            echo "✅ OilsExportPanel.jsx — OILS guard present"
          fi
          # Must NOT reference LIVE_ANIMALS
          if grep -q "LIVE_ANIMALS" "$PANEL"; then
            echo "::error::V8: OilsExportPanel.jsx references LIVE_ANIMALS — isolation broken"
            FAILED=1
          else
            echo "✅ OilsExportPanel.jsx — no LIVE_ANIMALS contamination"
