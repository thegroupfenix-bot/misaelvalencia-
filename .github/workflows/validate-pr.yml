          if ! grep -q "canViewInternalFinancials" glv-connect/frontend/src/components/OilsExportPanel.jsx; then
            echo "::error::V8.1: OilsExportPanel.jsx does not use canViewInternalFinancials — admin blocks unprotected"
            FAILED=1
          else
            echo "✅ OilsExportPanel.jsx — canViewInternalFinancials guard present"
          fi
          # Section 7 must be gated by canFinance, not just role
          if ! grep -q "canFinance" glv-connect/frontend/src/components/OilsExportPanel.jsx; then
            echo "::error::V8.1: OilsExportPanel.jsx Section 7 not gated by canFinance"
            FAILED=1
          else
            echo "✅ OilsExportPanel.jsx — canFinance gate present"
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8.1 Role engine and admin financial guard verified" >> $GITHUB_STEP_SUMMARY

      - name: V8.1 — Verify global destination engine
        run: |
          FAILED=0
          DEST_FILE="glv-connect/frontend/src/engines/oils/globalDestinationEngine.js"
          if [ ! -f "$DEST_FILE" ]; then
            echo "::error::V8.1: globalDestinationEngine.js missing"
            exit 1
          fi
          for sym in PRESET_DESTINATIONS GLOBAL_REGIONS resolveDestination calcGlobalContainerFreight hasPresetFreight; do
            if ! grep -q "$sym" "$DEST_FILE"; then
              echo "::error::V8.1: globalDestinationEngine.js missing: $sym"
              FAILED=1
            else
              echo "✅ globalDestinationEngine.js — $sym"
            fi
          done
          # Custom destination must be supported
          if ! grep -q "Custom" "$DEST_FILE"; then
            echo "::error::V8.1: globalDestinationEngine.js does not support custom destinations"
            FAILED=1
          fi
          # OilsExportPanel must use globalDestinationEngine
          if ! grep -q "globalDestinationEngine" glv-connect/frontend/src/components/OilsExportPanel.jsx; then
            echo "::error::V8.1: OilsExportPanel.jsx does not import globalDestinationEngine"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8.1 Global destination engine verified" >> $GITHUB_STEP_SUMMARY

      - name: V8.1 — Verify VAL-041 VAL-042 VAL-043 in validationSupervisor
        run: |
          FAILED=0
          for code in VAL-041 VAL-042 VAL-043; do
            if ! grep -q "$code" glv-connect/frontend/src/engines/validationSupervisor.js; then
              echo "::error::V8.1: $code missing from validationSupervisor.js"
              FAILED=1
            else
              echo "✅ validationSupervisor.js — $code present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8.1 VAL-041/042/043 PDF context guards present" >> $GITHUB_STEP_SUMMARY

      - name: V8.1 — Verify safeResolvePdfContext in GlvPDF
        run: |
          FAILED=0
          for sym in safeField safeStr safeNum safeArr isOilsRow; do
            if ! grep -q "$sym" glv-connect/frontend/src/components/GlvPDF.jsx; then
              echo "::error::V8.1: GlvPDF.jsx missing safe context symbol: $sym"
              FAILED=1
            else
              echo "✅ GlvPDF.jsx — $sym"
