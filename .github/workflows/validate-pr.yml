name: GLV-Connect PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  # ── 1. Detect critical file modifications ──────────────────────────────────
  critical-file-check:
    name: Critical File Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect critical file changes
        id: critical
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          CRITICAL_FILES=(
            "glv-connect/frontend/src/components/CommercialEngine.jsx"
            "glv-connect/frontend/src/components/GlvPDF.jsx"
            "glv-connect/frontend/src/utils/calculations.js"
            "glv-connect/frontend/src/engines/categoryEngine.js"
            "glv-connect/frontend/src/config/productCategories.js"
            "glv-connect/frontend/src/services/mediaAutoBinding.js"
            "glv-connect/frontend/src/App.jsx"
            "glv-connect/backend/server.js"
            "glv-connect/backend/nixpacks.toml"
            "glv-connect/backend/railway.toml"
            "glv-connect/backend/db/database.js"
            "glv-connect/backend/routes/documents.js"
            "glv-connect/backend/routes/media.js"
            "glv-connect/frontend/src/components/MediaPanel.jsx"
            "glv-connect/backend/services/mediaBinding.js"
            "glv-connect/commercial-error-registry.json"
          )

          HITS=""
          for f in "${CRITICAL_FILES[@]}"; do
            if echo "$CHANGED" | grep -qF "$f"; then
              HITS="$HITS\n⚠️  $f"
            fi
          done

          if [ -n "$HITS" ]; then
            echo "critical_modified=true" >> $GITHUB_OUTPUT
            {
              echo "## ⚠️ CRITICAL FILES MODIFIED"
              echo ""
              echo "This PR modifies files that are part of the protected stable core:"
              echo ""
              echo -e "$HITS"
              echo ""
              echo "**ENTERPRISE VALIDATION — Before merging, manually verify ALL of the following:**"
              echo ""
              echo "### PDF Price Integrity (Issue 1 guard)"
              echo "- [ ] User enters USD 3.50 → PDF renders USD 3.50 (NOT a PRICE_TABLE value)"
              echo "- [ ] No doc.pricePerKg fallback pollutes the PDF price field"
              echo "- [ ] engineUnitPrice is the sole source of pricePerKg in PDF Section 3"
              echo ""
              echo "### Category Formula Isolation (Issue 2 guard)"
              echo "- [ ] LIVE_ANIMALS: 1000 heads × 45 kg × 3.50 = USD 157,500 (head×weight×price)"
              echo "- [ ] FROZEN_MEAT: 25,000 kg × price = shipment value (NOT ×45)"
              echo "- [ ] FROZEN_POULTRY: direct quantity × price — no avgWeight injection"
              echo "- [ ] COMMODITIES: direct quantity × price — no avgWeight injection"
              echo "- [ ] totalKg shows quantity (not heads×45) for non-livestock categories"
              echo ""
              echo "### Container Type System (Issue 3 guard)"
              echo "- [ ] Container type selector visible in SCO/FCO creation form"
              echo "- [ ] Selected container type appears in PDF Section 2 logistics"
              echo "- [ ] LIVE_ANIMALS defaults to Livestock Vessel"
              echo "- [ ] FROZEN_MEAT defaults to Reefer 40FT"
              echo "- [ ] COMMODITIES defaults to Bulk Vessel"
              echo ""
              echo "### Media Panel (Issue 4 guard)"
              echo "- [ ] 'Administrar contenido visual' expandable panel appears in form"
              echo "- [ ] Auto Suggestions tab shows category-relevant images"
              echo "- [ ] Corporate Branding tab shows only GLV branding"
              echo "- [ ] LIVE_ANIMALS media panel does NOT show fruit/avocado images"
              echo "- [ ] Up to 6 images can be selected (slots Main, 2-5, Brand)"
              echo "- [ ] Layout selector offers 4 options"
              echo "- [ ] If no selection, auto-binding runs at PDF generation"
              echo ""
              echo "### Document Integrity"
              echo "- [ ] SCO generation produces correct PDF"
              echo "- [ ] FCO generation produces correct PDF"
              echo "- [ ] EN language renders entire document in English"
              echo "- [ ] ES language renders entire document in Spanish"
              echo "- [ ] Destination country and port are correct in PDF"
              echo "- [ ] No stale state between consecutive SCO/FCO forms"
              echo ""
              echo "### Infrastructure"
              echo "- [ ] Railway build succeeds (check Railway dashboard)"
              echo "- [ ] /health endpoint returns ok:true after deploy"
              echo "- [ ] Login and authentication work"
              echo "- [ ] Profile update works"
              echo "- [ ] Media/livestock images appear in PDF"
            } >> $GITHUB_STEP_SUMMARY
            echo "::warning::CRITICAL FILES modified in this PR — full enterprise validation required before merge"
          else
            echo "critical_modified=false" >> $GITHUB_OUTPUT
            echo "## ✅ No critical files modified" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 2. Static analysis — formula isolation guard ───────────────────────────
  formula-isolation-check:
    name: Formula Isolation Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PRICE_TABLE fallback contamination in GlvPDF.jsx
        run: |
          echo "Checking GlvPDF.jsx for prohibited PRICE_TABLE patterns..."

          # Fail if doc.pricePerKg is used as a fallback in a pricePerKg assignment (non-comment lines only)
          if grep -n "pricePerKg.*doc\.pricePerKg\|doc\.pricePerKg.*pricePerKg" glv-connect/frontend/src/components/GlvPDF.jsx \
              | grep -v "^[0-9]*:[[:space:]]*//" \
              | grep -v "legacyPrice\|isolation\|mismatch\|guard\|debug"; then
            echo "::error::PRICE_TABLE contamination detected — doc.pricePerKg must not be used as pricePerKg fallback in GlvPDF.jsx"
            echo "## ❌ PRICE_TABLE fallback found in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Warn if PRICE_TABLE lookup is present in GlvPDF.jsx (should only be in App.jsx for display)
          if grep -n "lookupPriceTable\|PRICE_TABLE" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::warning::PRICE_TABLE reference found in GlvPDF.jsx — verify it is not used for price injection"
            echo "## ⚠️ PRICE_TABLE reference in GlvPDF.jsx — manual review needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## ✅ No PRICE_TABLE fallback contamination in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY

      - name: Check category-aware formula in GlvPDF.jsx
        run: |
          echo "Checking GlvPDF.jsx for category-isolated formula..."

          # The fix: isLiveAnimalRow must gate head×weight formula
          if ! grep -n "isLiveAnimalRow" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::Category isolation variable 'isLiveAnimalRow' not found in GlvPDF.jsx — formula contamination risk"
            echo "## ❌ Missing category isolation in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "## ✅ Category-aware formula guard present in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY

      - name: Check container type propagation
        run: |
          echo "Checking container type implementation..."

          if ! grep -n "containerType" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::containerType not found in CommercialEngine.jsx"
            echo "## ❌ Container type system missing from CommercialEngine.jsx" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if ! grep -n "containerType\|CONTAINER_LABELS" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::containerType display not found in GlvPDF.jsx"
            echo "## ❌ Container type not rendered in PDF" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "## ✅ Container type system present in CommercialEngine.jsx and GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY

  # ── 3-A. Regression Protection Layer — DynamicCommercialEngine ────────────
  regression-protection:
    name: Regression Protection Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify commercial-error-registry.json is valid JSON
        run: |
          if ! python3 -c "import json,sys; json.load(open('glv-connect/commercial-error-registry.json'))" 2>&1; then
            echo "::error::commercial-error-registry.json is not valid JSON"
            exit 1
          fi
          echo "## ✅ commercial-error-registry.json valid" >> $GITHUB_STEP_SUMMARY

      - name: Run prevention_ci_manifest checks
        run: |
          python3 << 'PYEOF'
          import json, sys, os, subprocess

          registry = json.load(open("glv-connect/commercial-error-registry.json"))
          patterns = registry.get("prevention_ci_manifest", {}).get("patterns", [])
          failures = []

          for p in patterns:
              err_id   = p.get("id", "?")
              filepath = p.get("file", "")
              keyword  = p.get("must_contain", "")
              if not filepath or not keyword:
                  continue
              if not os.path.exists(filepath):
                  failures.append(f"{err_id}: file not found — {filepath}")
                  continue
              result = subprocess.run(["grep", "-q", keyword, filepath])
              if result.returncode != 0:
                  failures.append(f"{err_id}: '{keyword}' not found in {filepath}")

          if failures:
              print("::error:: REGRESSION DETECTED — previously fixed bugs may have been reintroduced:")
              for f in failures:
                  print(f"  ❌ {f}")
              sys.exit(1)
          else:
              print(f"✅ All {len(patterns)} regression prevention checks passed")
          PYEOF

          echo "## ✅ Regression Protection Layer — all checks passed" >> $GITHUB_STEP_SUMMARY

      - name: Verify DynamicCommercialEngine structure
        run: |
          ENGINE="glv-connect/frontend/src/engines/categoryEngine.js"

          if [ ! -f "$ENGINE" ]; then
            echo "::error::categoryEngine.js not found — DynamicCommercialEngine missing"
            echo "## ❌ categoryEngine.js not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          REQUIRED_EXPORTS=(
            "getCategoryEngine"
            "isLiveAnimalCategory"
            "getDefaultContainer"
            "getDefaultCargoType"
            "getPDFTextKey"
            "getCategoryMediaConfig"
            "CATEGORY_DEFAULT_CONTAINER"
            "CATEGORY_PDF_TEXT_KEY"
          )

          MISSING=""
          for export_name in "${REQUIRED_EXPORTS[@]}"; do
            if ! grep -q "$export_name" "$ENGINE"; then
              MISSING="$MISSING\n  ❌ $export_name"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::categoryEngine.js is missing required exports"
            echo -e "$MISSING"
            echo "## ❌ categoryEngine.js missing exports" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "## ✅ DynamicCommercialEngine structure valid — all required exports present" >> $GITHUB_STEP_SUMMARY

      - name: Check CommercialEngine uses categoryEngine (no scattered hardcoded maps)
        run: |
          CE="glv-connect/frontend/src/components/CommercialEngine.jsx"

          # Must import from categoryEngine
          if ! grep -q "categoryEngine" "$CE"; then
            echo "::error::CommercialEngine.jsx must import from categoryEngine.js"
            echo "## ❌ CommercialEngine.jsx not wired to categoryEngine" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "## ✅ CommercialEngine.jsx wired to categoryEngine" >> $GITHUB_STEP_SUMMARY

      - name: Check GlvPDF uses pdfTextKey routing (not fragile string matching)
        run: |
          PDF="glv-connect/frontend/src/components/GlvPDF.jsx"

          if ! grep -q "pdfTextKey" "$PDF"; then
            echo "::error::GlvPDF.jsx must use pdfTextKey routing from categoryEngine"
            echo "## ❌ GlvPDF.jsx not using pdfTextKey routing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Warn if isLivestock is still used for commercial logic (text blocks ok as fallback)
          LIVESTOCK_COUNT=$(grep -c "isLivestock" "$PDF" || true)
          echo "isLivestock() references remaining in GlvPDF.jsx: $LIVESTOCK_COUNT (expected: 2 fallback definitions + usage)"
          echo "## ✅ GlvPDF.jsx uses pdfTextKey routing — isLivestock() retained only as legacy fallback" >> $GITHUB_STEP_SUMMARY

      - name: Check mediaBinding has product category isolation
        run: |
          MB="glv-connect/backend/services/mediaBinding.js"

          if ! grep -q "isProductCategoryCompatible" "$MB"; then
            echo "::error::mediaBinding.js missing isProductCategoryCompatible — product media contamination risk"
            echo "## ❌ mediaBinding.js missing product category isolation" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if ! grep -q "ANIMAL_FEED\|LENTILS\|CHICKPEAS" "$MB"; then
            echo "::error::mediaBinding.js missing categories ANIMAL_FEED/LENTILS/CHICKPEAS — incomplete category coverage"
            echo "## ❌ mediaBinding.js incomplete category coverage" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "## ✅ mediaBinding.js has full category isolation (13 categories)" >> $GITHUB_STEP_SUMMARY

      - name: Arithmetic regression — unit conversion logic
        run: |
          python3 << 'PYEOF'
          # Verify the conversion constants in GlvPDF.jsx and calculations.js
          # are consistent with expected test case results

          with open("glv-connect/frontend/src/components/GlvPDF.jsx") as f:
              pdf_src = f.read()

          with open("glv-connect/frontend/src/utils/calculations.js") as f:
              calc_src = f.read()

          failures = []

          # CASE 1: MT conversion — must multiply by 1000
          if "engineQty * 1000" not in pdf_src and "qty * 1000 * price" not in calc_src:
              failures.append("MT→kg conversion (×1000) not found in GlvPDF.jsx or calculations.js")

          # CASE 2: totalKgDisplay must exist (ERR-006 guard)
          if "totalKgDisplay" not in pdf_src:
              failures.append("totalKgDisplay not found in GlvPDF.jsx — MT display bug may be reintroduced")

          # CASE 3: LIVE_ANIMALS formula guard
          if "isLiveAnimalRow" not in pdf_src:
              failures.append("isLiveAnimalRow guard not found in GlvPDF.jsx — LIVE_ANIMALS formula isolation broken")

          if failures:
              print("::error:: Arithmetic regression check FAILED:")
              for f in failures:
                  print(f"  ❌ {f}")
              import sys; sys.exit(1)

          print(f"✅ Arithmetic regression checks passed")
          print("  CASE 1 (54 MT × $3.4 = $183,600 / 54,000 kg): MT×1000 present")
          print("  CASE 2 (25,000 kg × $3.5 = $87,500): direct qty path present")
          print("  CASE 3 (LIVE_ANIMALS isolation): isLiveAnimalRow guard present")
          PYEOF

          echo "## ✅ Arithmetic regression checks passed" >> $GITHUB_STEP_SUMMARY

  # ── 3. Frontend build verification ────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: glv-connect/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: glv-connect/frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: glv-connect/frontend
        env:
          VITE_API_URL: https://misaelvalencia-production.up.railway.app
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f glv-connect/frontend/dist/index.html ]; then
            echo "::error::Frontend build did not produce dist/index.html"
            exit 1
          fi
          SIZE=$(du -sh glv-connect/frontend/dist | cut -f1)
          echo "Frontend build size: $SIZE"
          echo "## ✅ Frontend build succeeded — dist size: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Verify MediaPanel component built
        run: |
          if ! grep -r "MediaPanel\|Administrar contenido visual" glv-connect/frontend/dist/ 2>/dev/null | head -1; then
            echo "::warning::MediaPanel not found in build output — verify it was included"
          else
            echo "## ✅ MediaPanel present in build" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 4. Backend dependency check ────────────────────────────────────────────
  backend-deps:
    name: Backend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: glv-connect/backend/package-lock.json

      - name: Install backend dependencies (scripts disabled for CI speed)
        working-directory: glv-connect/backend
        run: npm install --ignore-scripts

      - name: Verify server.js entry point exists
        run: |
          if [ ! -f glv-connect/backend/server.js ]; then
            echo "::error::server.js not found — deploy will fail"
            exit 1
          fi
          echo "## ✅ Backend dependencies installed, server.js present" >> $GITHUB_STEP_SUMMARY

  # ── 5. Branch naming enforcement ──────────────────────────────────────────
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "PR branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(feature/|fix/|staging/|hotfix/|claude/)'; then
            echo "## ✅ Branch name follows policy: $BRANCH" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Branch '$BRANCH' does not follow naming convention (feature/*, fix/*, staging/*, hotfix/*)"
            echo "## ⚠️ Branch naming: $BRANCH does not follow feature/*, fix/*, staging/* convention" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 6. Stable snapshot tag on merge ───────────────────────────────────────
  # This job runs on push to main (after merge) to tag a stable release snapshot.
  snapshot-on-merge:
    name: Stable Release Snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create snapshot tag
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="snapshot/stable-${DATE}-${SHORT_SHA}"
          git config user.email "ci@glv-connect.internal"
          git config user.name "GLV CI"
          git tag -a "$TAG" -m "Stable release snapshot — $DATE [auto]"
          git push origin "$TAG"
          echo "## ✅ Snapshot tagged: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "Rollback command: git checkout $TAG" >> $GITHUB_STEP_SUMMARY
