          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8 GlvPDF.jsx oils section is category-gated and symbol-complete" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify no hardcoded prices in UI components
        run: |
          # Price data must live only in engine files, never in UI or component files
          PANEL="glv-connect/frontend/src/components/OilsExportPanel.jsx"
          # Panel should not contain raw price values — it reads from engine functions
          if grep -qE '(FOB|CFR|CIF).*[0-9]+\.[0-9]{2}' "$PANEL"; then
            echo "::error::V8: OilsExportPanel.jsx contains hardcoded price values — prices must live in oilsPricingEngine.js only"
            exit 1
          fi
          echo "✅ OilsExportPanel.jsx — no hardcoded prices detected"
          echo "## ✅ V8 No hardcoded prices in UI layer" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Regression guard: existing SCO categories unmodified
        run: |
          FAILED=0
