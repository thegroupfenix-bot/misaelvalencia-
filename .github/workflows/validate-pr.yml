          echo "## ✅ V8 Price matrix has PALM/SOYBEAN/SUNFLOWER × FOB/CFR/CIF" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify profit simulation targets and destination matrix
        run: |
          FAILED=0
          if ! grep -q "4500" glv-connect/frontend/src/engines/oils/profitSimulationEngine.js; then
            echo "::error::V8: profitSimulationEngine.js missing PROFIT_TARGET_MIN_USD=4500"
