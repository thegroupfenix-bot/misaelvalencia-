          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8 Profit targets and all 9 CFR/CIF destinations verified" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify GlvPDF oils section is category-gated
        run: |
          FAILED=0
          for sym in isOilsRow oilsConfig "Export Oils"; do
