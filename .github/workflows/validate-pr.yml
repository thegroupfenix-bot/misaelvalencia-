          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8: LIVE_ANIMALS isolation confirmed intact after oils engine addition" >> $GITHUB_STEP_SUMMARY

      - name: V8 — Verify price matrix coverage for all 3 oil types
        run: |
          FAILED=0
          PFILE="glv-connect/frontend/src/engines/oils/oilsPricingEngine.js"
