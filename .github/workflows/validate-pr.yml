            ["glv-connect/frontend/src/engines/oils/packagingCostEngine.js"]="PACKAGING_COST getPackagingCostPerUnit OIL_PACKAGING_TYPES"
            ["glv-connect/frontend/src/engines/oils/exportMarketEngine.js"]="MARKET_SEGMENTS getMarketMOQ getPreferredPackaging"
            ["glv-connect/frontend/src/engines/oils/oilsPouchEngine.js"]="OIL_POUCH_TYPES OIL_FILM_MATERIALS OIL_SEAL_TYPES"
            ["glv-connect/frontend/src/engines/oils/petPackagingEngine.js"]="PET_OIL_SIZES PET_CARTON_CONFIG"
            ["glv-connect/frontend/src/engines/oils/jerrycanEngine.js"]="INDUSTRIAL_FORMATS calcIndustrialShipment validateJerrycanMOQ"
