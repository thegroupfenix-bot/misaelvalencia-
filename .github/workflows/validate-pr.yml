          fi
          # oilsConfig should never appear inside LIVE_ANIMALS branch
          if ! grep -q "isLiveAnimalRow\|isLiveAnimal" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::V8: isLiveAnimalRow missing from GlvPDF.jsx"
            FAILED=1
          else
