          if ! grep -q "LivestockBreedSelector\|LIVE_ANIMALS" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::V8: LivestockBreedSelector or LIVE_ANIMALS logic removed from CommercialEngine.jsx"
            FAILED=1
          fi
          # Frozen cargo / FRUIT_PRODUCTS / COLOMBIAN_EXOTIC_FRUITS must still appear in DynamicFields hidden keys
          if ! grep -q "FRUIT_PRODUCTS\|COLOMBIAN_EXOTIC_FRUITS" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::V8: FRUIT_PRODUCTS / COLOMBIAN_EXOTIC_FRUITS logic removed from CommercialEngine.jsx"
            FAILED=1
          fi
          # calcCommercialSummary must still be imported (not replaced)
          if ! grep -q "calcCommercialSummary" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V8: calcCommercialSummary removed from calculations.js"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
