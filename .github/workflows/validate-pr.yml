name: GLV-Connect PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  # ── 1. Detect critical file modifications ──────────────────────────────────
  critical-file-check:
    name: Critical File Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect critical file changes
        id: critical
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          CRITICAL_FILES=(
            "glv-connect/frontend/src/components/CommercialEngine.jsx"
            "glv-connect/frontend/src/components/GlvPDF.jsx"
            "glv-connect/frontend/src/utils/calculations.js"
            "glv-connect/frontend/src/services/mediaAutoBinding.js"
            "glv-connect/frontend/src/App.jsx"
            "glv-connect/backend/server.js"
            "glv-connect/backend/nixpacks.toml"
            "glv-connect/backend/railway.toml"
            "glv-connect/backend/db/database.js"
            "glv-connect/backend/routes/documents.js"
            "glv-connect/backend/routes/media.js"
            "glv-connect/frontend/src/components/MediaPanel.jsx"
            "glv-connect/backend/services/mediaBinding.js"
            "glv-connect/frontend/src/engines/categoryEngine.js"
            "glv-connect/frontend/src/engines/containerEngine.js"
            "glv-connect/frontend/src/engines/categoryProfiles.js"
            "glv-connect/frontend/src/engines/packagingEngine.js"
            "glv-connect/frontend/src/engines/commercialFormulaEngine.js"
            "glv-connect/frontend/src/engines/pdfContextResolver.js"
            "glv-connect/frontend/src/engines/mediaContextResolver.js"
            "glv-connect/frontend/src/engines/validationSupervisor.js"
            "glv-connect/commercial-error-registry.json"
          )

          HITS=""
          for f in "${CRITICAL_FILES[@]}"; do
            if echo "$CHANGED" | grep -qF "$f"; then
              HITS="$HITS\n⚠️  $f"
            fi
          done

          if [ -n "$HITS" ]; then
            echo "critical_modified=true" >> $GITHUB_OUTPUT
            {
              echo "## ⚠️ CRITICAL FILES MODIFIED"
              echo ""
              echo "This PR modifies files that are part of the protected stable core:"
              echo ""
              echo -e "$HITS"
              echo ""
              echo "**ENTERPRISE VALIDATION — Before merging, manually verify ALL of the following:**"
              echo ""
              echo "### PDF Price Integrity (Issue 1 guard)"
              echo "- [ ] User enters USD 3.50 → PDF renders USD 3.50 (NOT a PRICE_TABLE value)"
              echo "- [ ] No doc.pricePerKg fallback pollutes the PDF price field"
              echo "- [ ] engineUnitPrice is the sole source of pricePerKg in PDF Section 3"
              echo ""
              echo "### Category Formula Isolation (Issue 2 guard)"
              echo "- [ ] LIVE_ANIMALS: 1000 heads × 45 kg × 3.50 = USD 157,500 (head×weight×price)"
              echo "- [ ] FROZEN_MEAT: 25,000 kg × price = shipment value (NOT ×45)"
              echo "- [ ] FROZEN_POULTRY: direct quantity × price — no avgWeight injection"
              echo "- [ ] COMMODITIES: direct quantity × price — no avgWeight injection"
              echo "- [ ] totalKg shows quantity (not heads×45) for non-livestock categories"
              echo ""
              echo "### Container Type System (Issue 3 guard)"
              echo "- [ ] Container type selector visible in SCO/FCO creation form"
              echo "- [ ] Selected container type appears in PDF Section 2 logistics"
              echo "- [ ] LIVE_ANIMALS defaults to Livestock Vessel"
              echo "- [ ] FROZEN_MEAT defaults to Reefer 40FT"
              echo "- [ ] COMMODITIES defaults to Bulk Vessel"
              echo ""
              echo "### Media Panel (Issue 4 guard)"
              echo "- [ ] 'Administrar contenido visual' expandable panel appears in form"
              echo "- [ ] Auto Suggestions tab shows category-relevant images"
              echo "- [ ] Corporate Branding tab shows only GLV branding"
              echo "- [ ] LIVE_ANIMALS media panel does NOT show fruit/avocado images"
              echo "- [ ] Up to 6 images can be selected (slots Main, 2-5, Brand)"
              echo "- [ ] Layout selector offers 4 options"
              echo "- [ ] If no selection, auto-binding runs at PDF generation"
              echo ""
              echo "### Document Integrity"
              echo "- [ ] SCO generation produces correct PDF"
              echo "- [ ] FCO generation produces correct PDF"
              echo "- [ ] EN language renders entire document in English"
              echo "- [ ] ES language renders entire document in Spanish"
              echo "- [ ] Destination country and port are correct in PDF"
              echo "- [ ] No stale state between consecutive SCO/FCO forms"
              echo ""
              echo "### Infrastructure"
              echo "- [ ] Railway build succeeds (check Railway dashboard)"
              echo "- [ ] /health endpoint returns ok:true after deploy"
              echo "- [ ] Login and authentication work"
              echo "- [ ] Profile update works"
              echo "- [ ] Media/livestock images appear in PDF"
            } >> $GITHUB_STEP_SUMMARY
            echo "::warning::CRITICAL FILES modified in this PR — full enterprise validation required before merge"
          else
            echo "critical_modified=false" >> $GITHUB_OUTPUT
            echo "## ✅ No critical files modified" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 2. Error Memory + Formula Isolation Guard ─────────────────────────────
  formula-isolation-check:
    name: Formula Isolation Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ERROR_MEMORY.json exists and is valid JSON
        run: |
          if [ ! -f ERROR_MEMORY.json ]; then
            echo "::error::ERROR_MEMORY.json not found — required for enterprise CI"
            exit 1
          fi
          if ! python3 -c "import json,sys; json.load(open('ERROR_MEMORY.json'))" 2>&1; then
            echo "::error::ERROR_MEMORY.json is not valid JSON"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('ERROR_MEMORY.json')); print(len(d['errors']))")
          echo "## ✅ ERROR_MEMORY.json valid — $COUNT error records" >> $GITHUB_STEP_SUMMARY

      - name: Validate all prevention patterns from ERROR_MEMORY.json
        run: |
          echo "Running ERROR_MEMORY prevention manifest checks..."
          FAILED=0

          python3 << 'PYEOF'
          import json, subprocess, sys

          with open("ERROR_MEMORY.json") as f:
            mem = json.load(f)

          manifest = mem.get("prevention_ci_manifest", {}).get("patterns", [])
          failed = []

          for p in manifest:
            fpath = p["file"]
            pattern = p["must_contain"]
            err_id = p["id"]
            try:
              with open(fpath) as fh:
                content = fh.read()
              if pattern not in content:
                failed.append(f"{err_id}: '{pattern}' not found in {fpath}")
                print(f"::error::{err_id} prevention pattern missing: '{pattern}' not in {fpath}")
              else:
                print(f"✅ {err_id}: '{pattern}' present in {fpath}")
            except FileNotFoundError:
              failed.append(f"{err_id}: file not found {fpath}")
              print(f"::error::{err_id}: file not found {fpath}")

          if failed:
            print("\n::error::ERROR_MEMORY prevention patterns FAILED:")
            for f in failed:
              print(f"  - {f}")
            sys.exit(1)
          else:
            print("\nAll ERROR_MEMORY prevention patterns verified.")
          PYEOF

      - name: Check for PRICE_TABLE fallback contamination in GlvPDF.jsx
        run: |
          echo "Checking GlvPDF.jsx for prohibited PRICE_TABLE patterns..."

          # Fail if doc.pricePerKg is used as a fallback in a pricePerKg assignment (non-comment lines only)
          if grep -n "pricePerKg.*doc\.pricePerKg\|doc\.pricePerKg.*pricePerKg" glv-connect/frontend/src/components/GlvPDF.jsx \
              | grep -v "^[0-9]*:[[:space:]]*//" \
              | grep -v "legacyPrice\|isolation\|mismatch\|guard\|debug"; then
            echo "::error::PRICE_TABLE contamination detected — doc.pricePerKg must not be used as pricePerKg fallback in GlvPDF.jsx"
            echo "## ❌ PRICE_TABLE fallback found in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Warn if PRICE_TABLE lookup is present in GlvPDF.jsx (should only be in App.jsx for display)
          if grep -n "lookupPriceTable\|PRICE_TABLE" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::warning::PRICE_TABLE reference found in GlvPDF.jsx — verify it is not used for price injection"
            echo "## ⚠️ PRICE_TABLE reference in GlvPDF.jsx — manual review needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## ✅ No PRICE_TABLE fallback contamination in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY

      - name: Check category-aware formula in GlvPDF.jsx
        run: |
          echo "Checking GlvPDF.jsx for category-isolated formula..."
          if ! grep -n "isLiveAnimalRow" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::Category isolation variable 'isLiveAnimalRow' not found in GlvPDF.jsx — formula contamination risk"
            echo "## ❌ Missing category isolation in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Category-aware formula guard present in GlvPDF.jsx" >> $GITHUB_STEP_SUMMARY

      - name: Check container type propagation
        run: |
          if ! grep -q "containerType" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::containerType not found in CommercialEngine.jsx"
            exit 1
          fi
          if ! grep -q "containerType\|CONTAINER_LABELS" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::containerType display not found in GlvPDF.jsx"
            exit 1
          fi
          echo "## ✅ Container type system present" >> $GITHUB_STEP_SUMMARY

      - name: Check media category isolation (product assets)
        run: |
          if ! grep -q "isProductCategoryCompatible\|PRODUCT_CATEGORY_EXCLUSIONS" glv-connect/backend/services/mediaBinding.js; then
            echo "::error::ERR-007: isProductCategoryCompatible not found — FRUIT_PRODUCTS can still show livestock images"
            echo "## ❌ Product category isolation missing from mediaBinding.js" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Product category isolation present in mediaBinding.js" >> $GITHUB_STEP_SUMMARY

      - name: Check profile validation short-circuit
        run: |
          if ! grep -q "completed.*!== 1\|completed !== 1\|completed === 1" glv-connect/frontend/src/utils/validateDoc.js; then
            echo "::error::ERR-008: Profile completed short-circuit not found in validateDoc.js — agents will be stuck in validation loop"
            echo "## ❌ Profile completion short-circuit missing from validateDoc.js" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ✅ Profile completion short-circuit present in validateDoc.js" >> $GITHUB_STEP_SUMMARY

  # ── 2b. DynamicCommercialEngine regression protection ─────────────────────
  regression-protection:
    name: DynamicCommercialEngine Regression Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify commercial-error-registry.json is valid JSON
        run: |
          if [ ! -f glv-connect/commercial-error-registry.json ]; then
            echo "::error::commercial-error-registry.json not found"
            exit 1
          fi
          if ! python3 -c "import json,sys; json.load(open('glv-connect/commercial-error-registry.json'))" 2>&1; then
            echo "::error::commercial-error-registry.json is not valid JSON"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('glv-connect/commercial-error-registry.json')); print(len(d.get('errors',[])))")
          echo "## ✅ commercial-error-registry.json valid — $COUNT error records" >> $GITHUB_STEP_SUMMARY

      - name: Verify categoryEngine.js required exports
        run: |
          REQUIRED=(
            "getCategoryEngine"
            "getDefaultContainer"
            "getDefaultCargoType"
            "getPDFTextKey"
            "getCategoryMediaConfig"
            "isLiveAnimalCategory"
            "isFrozenCategory"
            "isFruitCategory"
          )
          FAILED=0
          for sym in "${REQUIRED[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/engines/categoryEngine.js; then
              echo "::error::categoryEngine.js missing required export: $sym"
              FAILED=1
            else
              echo "✅ $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ categoryEngine.js exports verified" >> $GITHUB_STEP_SUMMARY

      - name: Verify CommercialEngine wired to categoryEngine
        run: |
          if ! grep -q "categoryEngine" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::CommercialEngine.jsx is not importing from categoryEngine.js"
            exit 1
          fi
          echo "## ✅ CommercialEngine imports categoryEngine" >> $GITHUB_STEP_SUMMARY

      - name: Verify GlvPDF uses pdfTextKey routing
        run: |
          if ! grep -q "pdfTextKey" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::GlvPDF.jsx does not use pdfTextKey routing — fragile string-match regression risk"
            exit 1
          fi
          if ! grep -q "getPDFTextKey" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::GlvPDF.jsx does not import getPDFTextKey from categoryEngine"
            exit 1
          fi
          echo "## ✅ GlvPDF uses pdfTextKey routing" >> $GITHUB_STEP_SUMMARY

      - name: Verify mediaBinding has full 13-category isolation
        run: |
          CATEGORIES=(LIVE_ANIMALS FROZEN_MEAT FROZEN_POULTRY FRUIT_PRODUCTS COLOMBIAN_EXOTIC_FRUITS COMMODITIES BEANS CANNED_MEAT LENTILS CHICKPEAS ANIMAL_FEED OILS EGGS)
          FAILED=0
          for cat in "${CATEGORIES[@]}"; do
            if ! grep -q "$cat" glv-connect/backend/services/mediaBinding.js; then
              echo "::error::mediaBinding.js missing category: $cat"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ mediaBinding.js has all 13 categories" >> $GITHUB_STEP_SUMMARY

      - name: Verify V4 engine files exist and have required exports
        run: |
          ENGINES=(
            "glv-connect/frontend/src/engines/containerEngine.js:CONTAINER_SPECS"
            "glv-connect/frontend/src/engines/categoryProfiles.js:getCategoryProfile"
            "glv-connect/frontend/src/engines/packagingEngine.js:normalizeToKg"
            "glv-connect/frontend/src/engines/commercialFormulaEngine.js:resolveFormula"
            "glv-connect/frontend/src/engines/pdfContextResolver.js:resolvePDFContext"
            "glv-connect/frontend/src/engines/mediaContextResolver.js:resolveMediaContext"
            "glv-connect/frontend/src/engines/validationSupervisor.js:validateDocument"
          )
          FAILED=0
          for entry in "${ENGINES[@]}"; do
            FILE="${entry%%:*}"
            SYMBOL="${entry##*:}"
            if [ ! -f "$FILE" ]; then
              echo "::error::V4 engine file missing: $FILE"
              FAILED=1
            elif ! grep -q "$SYMBOL" "$FILE"; then
              echo "::error::V4 engine $FILE missing required export: $SYMBOL"
              FAILED=1
            else
              echo "✅ $FILE — $SYMBOL present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ All V4 engine files present with required exports" >> $GITHUB_STEP_SUMMARY

      - name: Verify containerEngine imported in CommercialEngine
        run: |
          if ! grep -q "containerEngine" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::CommercialEngine.jsx is not importing from containerEngine.js — CONTAINER_TYPES may be stale"
            exit 1
          fi
          echo "## ✅ CommercialEngine imports containerEngine" >> $GITHUB_STEP_SUMMARY

      - name: V5 — Verify getContainerLabel used (no hardcoded 20-foot label)
        run: |
          if ! grep -q "getContainerLabel" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::ERR-014: getContainerLabel not found in CommercialEngine.jsx — container label may be hardcoded to 20FT"
            exit 1
          fi
          echo "## ✅ ERR-014: getContainerLabel used — no hardcoded 20FT label" >> $GITHUB_STEP_SUMMARY

      - name: V5 — Verify packagingEngine has liquid engine symbols
        run: |
          SYMBOLS=(COMMERCIAL_SALE_UNITS BULK_INDUSTRIAL_OPTIONS RETAIL_CONSUMER_OPTIONS getSaleUnitsForProfile)
          FAILED=0
          for sym in "${SYMBOLS[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/engines/packagingEngine.js; then
              echo "::error::V5 packagingEngine.js missing: $sym"
              FAILED=1
            else
              echo "✅ packagingEngine.js — $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V5 packagingEngine.js has all liquid engine symbols" >> $GITHUB_STEP_SUMMARY

      - name: V5 — Verify calculations.js has commercialUnit multi-mode switch
        run: |
          if ! grep -q "commercialUnit" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V5 commercialUnit switch not found in calculations.js — liquid products forced to perKg"
            exit 1
          fi
          if ! grep -q "perLiter\|perBox\|perDrum" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V5 liquid pricing modes (perLiter, perBox, perDrum) not found in calculations.js"
            exit 1
          fi
          echo "## ✅ V5 commercialUnit multi-mode switch present in calculations.js" >> $GITHUB_STEP_SUMMARY

      - name: V5 — Verify GlvPDF renders packaging fields
        run: |
          SYMBOLS=(packagingType presentationSize commercialUnit PACKAGING_TYPE_LABELS COMMERCIAL_UNIT_LABELS)
          FAILED=0
          for sym in "${SYMBOLS[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/components/GlvPDF.jsx; then
              echo "::error::V5 GlvPDF.jsx missing packaging PDF field: $sym"
              FAILED=1
            else
              echo "✅ GlvPDF.jsx — $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V5 GlvPDF.jsx renders packaging fields (type, size, commercial unit)" >> $GITHUB_STEP_SUMMARY

      - name: V5 — Verify validationSupervisor has VAL-011 and VAL-012
        run: |
          if ! grep -q "VAL-011" glv-connect/frontend/src/engines/validationSupervisor.js; then
            echo "::error::V5 VAL-011 (commercial unit required) missing from validationSupervisor.js"
            exit 1
          fi
          if ! grep -q "VAL-012" glv-connect/frontend/src/engines/validationSupervisor.js; then
            echo "::error::V5 VAL-012 (packaging mode required) missing from validationSupervisor.js"
            exit 1
          fi
          echo "## ✅ V5 validationSupervisor has VAL-011 and VAL-012" >> $GITHUB_STEP_SUMMARY

      - name: V6 — Verify packagingEngine has Export Format + Multi-SKU symbols
        run: |
          SYMBOLS=(EXPORT_FORMAT_OPTIONS INDUSTRIAL_SALE_UNITS SKU_SALE_UNITS SKU_PACKAGING_TYPES isRetailExportFormat getExportFormatLabel getUnitContext)
          FAILED=0
          for sym in "${SYMBOLS[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/engines/packagingEngine.js; then
              echo "::error::V6 packagingEngine.js missing symbol: $sym"
              FAILED=1
            else
              echo "✅ packagingEngine.js — $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V6 packagingEngine.js has all Multi-SKU export symbols" >> $GITHUB_STEP_SUMMARY

      - name: V6 — Verify calculations.js has Multi-SKU summary engine
        run: |
          SYMBOLS=(calcSkuShipmentValue calcMultiSkuSummary)
          FAILED=0
          for sym in "${SYMBOLS[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/utils/calculations.js; then
              echo "::error::V6 calculations.js missing: $sym"
              FAILED=1
            else
              echo "✅ calculations.js — $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V6 calculations.js has Multi-SKU engine functions" >> $GITHUB_STEP_SUMMARY

      - name: V6 — Verify validationSupervisor has V6 SKU checks (VAL-015 through VAL-018)
        run: |
          FAILED=0
          for code in VAL-015 VAL-016 VAL-017 VAL-018; do
            if ! grep -q "$code" glv-connect/frontend/src/engines/validationSupervisor.js; then
              echo "::error::V6 $code missing from validationSupervisor.js"
              FAILED=1
            else
              echo "✅ validationSupervisor.js — $code present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V6 validationSupervisor has SKU checks VAL-015 to VAL-018" >> $GITHUB_STEP_SUMMARY

      - name: V6 — Verify GlvPDF renders SKU table
        run: |
          SYMBOLS=(rowSkus exportFormat "SKU Breakdown" skus.length)
          FAILED=0
          for sym in "${SYMBOLS[@]}"; do
            if ! grep -q "$sym" glv-connect/frontend/src/components/GlvPDF.jsx; then
              echo "::error::V6 GlvPDF.jsx missing Multi-SKU symbol: $sym"
              FAILED=1
            else
              echo "✅ GlvPDF.jsx — $sym present"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V6 GlvPDF.jsx has Multi-SKU breakdown table" >> $GITHUB_STEP_SUMMARY

      - name: V6 — Verify LIVE_ANIMALS isolation still intact after V6 changes
        run: |
          # GlvPDF uses isLiveAnimalRow variable; calculations.js guards directly on category === "LIVE_ANIMALS"
          if ! grep -q "isLiveAnimalRow" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::V6: isLiveAnimalRow guard missing from GlvPDF.jsx — LIVE_ANIMALS isolation may be broken"
            exit 1
          fi
          if ! grep -q "LIVE_ANIMALS" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V6: LIVE_ANIMALS category guard missing from calculations.js — livestock formula isolation broken"
            exit 1
          fi
          # ExportFormatEngine must short-circuit for LIVE_ANIMALS
          if ! grep -q "LIVE_ANIMALS.*return null\|return null.*LIVE_ANIMALS" glv-connect/frontend/src/components/CommercialEngine.jsx; then
            echo "::error::V6: ExportFormatEngine LIVE_ANIMALS null-guard missing from CommercialEngine.jsx"
            exit 1
          fi
          echo "## ✅ V6: LIVE_ANIMALS isolation confirmed intact after Multi-SKU changes" >> $GITHUB_STEP_SUMMARY

      - name: Verify MT×1000 conversion and isLiveAnimalRow guard
        run: |
          if ! grep -q "isMT\|MT.*1000\|1000.*MT\|\* 1000" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::MT×1000 conversion not found in GlvPDF.jsx — 54 MT will display as 54 kg"
            exit 1
          fi
          if ! grep -q "isLiveAnimalRow" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::isLiveAnimalRow not found in GlvPDF.jsx — category isolation broken"
            exit 1
          fi
          echo "## ✅ MT conversion and isLiveAnimalRow guard present" >> $GITHUB_STEP_SUMMARY

      - name: V6.1 — Verify frequency engine fixes (WEEKLY/BIWEEKLY + resolveShipmentCount)
        run: |
          FAILED=0
          if ! grep -q "WEEKLY.*52\|52.*WEEKLY" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V6.1: WEEKLY (52/year) missing from FREQ_MULTIPLIERS in calculations.js"
            FAILED=1
          fi
          if ! grep -q "BIWEEKLY.*24\|24.*BIWEEKLY" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V6.1: BIWEEKLY (24/year) missing from FREQ_MULTIPLIERS in calculations.js"
            FAILED=1
          fi
          if ! grep -q "resolveShipmentCount" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V6.1: resolveShipmentCount not exported from calculations.js"
            FAILED=1
          fi
          if ! grep -q "WEEKLY" glv-connect/frontend/src/config/productCategories.js; then
            echo "::error::V6.1: WEEKLY missing from DELIVERY_FREQUENCIES in productCategories.js"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V6.1 frequency engine: WEEKLY/BIWEEKLY + resolveShipmentCount verified" >> $GITHUB_STEP_SUMMARY

      - name: V6.1 — Verify ONE_SHIPMENT contract value fix and dynamic price label
        run: |
          FAILED=0
          if ! grep -q "ONE_SHIPMENT.*shipmentValue\|shipmentValue.*ONE_SHIPMENT" glv-connect/frontend/src/utils/calculations.js; then
            echo "::error::V6.1: ONE_SHIPMENT contractValue fix missing — contract value may still multiply by duration"
            FAILED=1
          fi
          if ! grep -q "dynamicPriceLbl" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::V6.1: dynamicPriceLbl missing from GlvPDF.jsx — PDF still shows hardcoded USD/kg for all products"
            FAILED=1
          fi
          if ! grep -q "hiddenKeys" glv-connect/frontend/src/components/CommercialEngine.jsx; then
