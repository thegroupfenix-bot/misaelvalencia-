          if ! grep -q "Oil Technical Specification\|Oil Technical" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::V8.1: GlvPDF.jsx missing oil technical specification block"
            FAILED=1
          fi
          # Export logistics summary must be present
          if ! grep -q "Export Logistics Summary\|Logistics Summary" glv-connect/frontend/src/components/GlvPDF.jsx; then
            echo "::error::V8.1: GlvPDF.jsx missing export logistics summary"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "## ✅ V8.1 GlvPDF safe context helpers and new PDF sections verified" >> $GITHUB_STEP_SUMMARY

      - name: V8.1 — Verify admin blocks never rendered for non-admin
        run: |
          # Section 7 (admin financials) must be wrapped in canFinance guard
          # Profit simulation must only appear inside canFinance block
          if ! grep -q "canFinance && " glv-connect/frontend/src/components/OilsExportPanel.jsx; then
            echo "::error::V8.1: OilsExportPanel.jsx Section 7 not gated — admin data leaks to non-admin users"
            exit 1
          fi
          # simulation (profit data) must only be in admin oilsConfig payload when canFinance
          if ! grep -q "canFinance ? {" glv-connect/frontend/src/components/OilsExportPanel.jsx && \
             ! grep -q "canFinance &&" glv-connect/frontend/src/components/OilsExportPanel.jsx; then
            echo "::error::V8.1: oilsConfig payload does not gate admin financials — simulation/reserves may leak"
