<!doctype html><html><head><meta charset="utf-8"></head><body><script>
'use strict';
const config = <?!= config ?>;
let active = false;
window.addEventListener('message', function(event) {
  if (event.source !== window.top || event.origin !== config.origin || !event.data || event.data.channel !== config.channel || event.data.type !== 'GLV_SUBMIT' || active) return;
  active = true;
  const requestId = event.data.requestId;
  const payload = Object.assign({}, event.data.payload, config);
  google.script.run.withSuccessHandler(function(result) {
    active = false;
    window.top.postMessage({type:'GLV_RESULT',channel:config.channel,requestId:requestId,result:result},config.origin);
  }).withFailureHandler(function() {
    active = false;
    window.top.postMessage({type:'GLV_RESULT',channel:config.channel,requestId:requestId,result:{ok:false,error:'SERVICE_ERROR'}},config.origin);
  }).submitForm(payload);
});
window.top.postMessage({type:'GLV_READY',channel:config.channel},config.origin);
</script></body></html>
